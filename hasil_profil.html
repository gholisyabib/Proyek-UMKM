<!DOCTYPE html>
<html lang="id">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Profil Tersimpan - MADIN</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            min-height: 100vh;

            background: #ffffff;

            font-family: "Inter", sans-serif;

            color: #000000;
        }

        .container {
            width: 700px;

            margin: 70px auto;

            background: #EFECEC;

            padding: 35px;

            border-radius: 5px;
        }

        h1 {
            margin-top: 0;

            color: #503232;

            font-size: 28px;

            font-weight: 700;
        }

        .photo {
            width: 120px;
            height: 120px;

            border-radius: 50%;

            background: #503232;

            overflow: hidden;

            margin-bottom: 25px;
        }

        .photo img {
            width: 100%;
            height: 100%;

            object-fit: cover;

            display: none;
        }

        .data {
            margin-bottom: 15px;
        }

        .label {
            font-size: 14px;

            font-weight: 600;

            color: #818181;

            margin-bottom: 5px;
        }

        .value {
            min-height: 38px;

            padding: 10px;

            background: #ffffff;

            border: 1px solid #818181;

            font-size: 15px;

            font-weight: 400;
        }

        .back {
            display: inline-block;

            margin-top: 20px;

            padding: 12px 25px;

            background: #503232;

            color: #ffffff;

            text-decoration: none;

            font-size: 15px;

            font-weight: 500;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>
        Profil Berhasil Disimpan
    </h1>


    <div class="photo">

        <img
            id="foto"
            alt="Foto Profil"
        >

    </div>


    <div class="data">

        <div class="label">
            Nama Lengkap
        </div>

        <div
            class="value"
            id="nama"
        ></div>

    </div>


    <div class="data">

        <div class="label">
            Email
        </div>

        <div
            class="value"
            id="email"
        ></div>

    </div>


    <div class="data">

        <div class="label">
            Nomor Telepon
        </div>

        <div
            class="value"
            id="telepon"
        ></div>

    </div>


    <div class="data">

        <div class="label">
            Tanggal Lahir
        </div>

        <div
            class="value"
            id="tanggal"
        ></div>

    </div>


    <div class="data">

        <div class="label">
            Jenis Kelamin
        </div>

        <div
            class="value"
            id="jenisKelamin"
        ></div>

    </div>


    <div class="data">

        <div class="label">
            Alamat Lengkap
        </div>

        <div
            class="value"
            id="alamat"
        ></div>

    </div>


    <a
        href="profil.html"
        class="back"
    >
        Kembali ke Profil
    </a>

</div>


<script>

    const saved =
        localStorage.getItem(
            "dataProfilMadin"
        );


    if (saved) {

        const data =
            JSON.parse(saved);


        document.getElementById(
            "nama"
        ).textContent =
            data.nama || "-";


        document.getElementById(
            "email"
        ).textContent =
            data.email || "-";


        document.getElementById(
            "telepon"
        ).textContent =
            data.telepon || "-";


        document.getElementById(
            "tanggal"
        ).textContent =
            data.tanggal || "-";


        document.getElementById(
            "jenisKelamin"
        ).textContent =
            data.jenisKelamin || "-";


        document.getElementById(
            "alamat"
        ).textContent =
            data.alamat || "-";


        if (data.foto) {

            const foto =
                document.getElementById(
                    "foto"
                );

            foto.src =
                data.foto;

            foto.style.display =
                "block";
        }

    }

</script>

</body>
</html>
